<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML → PDF</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f5f3;
            --card: #ffffff;
            --border: #e2e1dc;
            --text: #1c1c1a;
            --muted: #74746c;
            --accent: #b3492f;
            --danger: #b42318;
            --shadow: 0 10px 26px -12px rgba(179, 73, 47, 0.22);
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
            /* Color reserved for actions, not spread across the background. */
            background:
                radial-gradient(circle at 10% 0%, color-mix(in srgb, var(--border) 60%, transparent), transparent 42%),
                var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, sans-serif;
        }
        .wrap {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }
        .brand { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.35rem; }
        .brand-mark {
            width: 1.5rem;
            height: 1.5rem;
            flex-shrink: 0;
            color: var(--accent);
        }
        .brand-mark svg { width: 100%; height: 100%; }
        h1 {
            font-size: 1.6rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        p.lead { color: var(--muted); margin: 0.5rem 0 1.5rem; font-size: 0.9rem; }
        .card {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 2rem;
            box-shadow: var(--shadow);
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .tabs label {
            flex: 1;
            text-align: center;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .tabs input:checked + span { font-weight: 600; }
        .tabs label:has(input:checked) {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
        }
        /* Keeps the radio keyboard-accessible (unlike `display: none`) with a visible focus ring. */
        .tabs label:has(input:focus-visible) {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        textarea, input[type="text"], input[type="file"], select {
            width: 100%;
            font: inherit;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: transparent;
            color: inherit;
        }
        /* Some browsers render <option>s with the light system palette even in dark mode otherwise. */
        select option {
            background: var(--card);
            color: var(--text);
        }
        select:disabled { opacity: 0.5; cursor: not-allowed; }
        textarea {
            min-height: 220px;
            resize: vertical;
            font-family: ui-monospace, monospace;
            font-size: 0.85rem;
        }
        .field { margin-bottom: 1rem; }
        .field.is-disabled { opacity: 0.5; }
        label.field-label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.35rem;
        }
        .hint {
            margin: 0.35rem 0 0;
            font-size: 0.75rem;
            color: var(--muted);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.65rem;
            background: var(--accent);
            box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--accent) 55%, transparent);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }
        button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px -6px color-mix(in srgb, var(--accent) 60%, transparent); }
        button:active:not(:disabled) { transform: translateY(0); }
        button:disabled { cursor: not-allowed; opacity: 0.6; box-shadow: none; }
        #convert-btn { position: relative; }
        #convert-btn.is-loading { color: transparent; }
        #convert-btn.is-loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1rem;
            height: 1rem;
            margin: -0.5rem 0 0 -0.5rem;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            background: #fff2f2;
            border: 1px solid #f5c2c2;
            color: var(--danger);
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        .result-card {
            margin-top: 1.5rem;
        }
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }
        .result-header h2 { font-size: 1rem; margin: 0; }
        .result-actions { display: flex; gap: 0.5rem; }
        .result-actions a, .result-actions button {
            width: auto;
            padding: 0.4rem 0.9rem;
            font-size: 0.8rem;
            border-radius: 0.4rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border) !important;
            box-shadow: none;
        }
        .btn-secondary:hover:not(:disabled) { background: var(--bg); box-shadow: none; transform: none; }
        #preview-frame {
            width: 100%;
            height: 70vh;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            background: #fff;
        }
        /* Dark theme only via explicit, persisted `data-theme` choice — never OS preference. */
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #161615;
            --card: #1d1d1c;
            --border: #2c2c2a;
            --text: #ececea;
            --muted: #9c9c94;
            --accent: #c96345;
            --shadow: 0 10px 26px -12px rgba(201, 99, 69, 0.32);
        }
        :root[data-theme="dark"] .error {
            background: color-mix(in srgb, var(--danger) 18%, var(--card));
            border-color: var(--danger);
        }
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }
        .theme-toggle:hover { transform: translateY(-2px); }
        .theme-toggle svg { width: 1.15rem; height: 1.15rem; }
    </style>
    <script>
        // Must run before first paint to avoid a light-then-dark flash.
        if (localStorage.getItem('pdf-tools-theme') === 'dark') {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
</head>
<body>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Passer au thème sombre">
        <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>

    <div class="wrap">
        <a href="/" style="display: inline-block; margin-bottom: 1rem; font-size: 0.8rem; color: var(--muted); text-decoration: none;">&larr; Portail</a>
        <div class="brand">
            <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></span>
            <h1>HTML → PDF</h1>
        </div>
        <p class="lead">Collez du code HTML ou choisissez un fichier, puis téléchargez le PDF généré.</p>

        <div class="card">
            <div id="errors"></div>

            <form action="/api/convert" method="POST" enctype="multipart/form-data" id="convert-form">
                <div class="tabs">
                    <label>
                        <input type="radio" name="mode" value="html" class="sr-only" checked>
                        <span>Coller du HTML</span>
                    </label>
                    <label>
                        <input type="radio" name="mode" value="file" class="sr-only">
                        <span>Uploader un fichier</span>
                    </label>
                </div>

                <div class="field" id="html-field">
                    <label class="field-label" for="html">Code HTML</label>
                    <textarea id="html" name="html" placeholder="<h1>Bonjour</h1>"></textarea>
                </div>

                <div class="field" id="file-field" hidden>
                    <label class="field-label" for="file">Fichier (.html, .htm, .txt)</label>
                    <input type="file" id="file" name="file" accept=".html,.htm,.txt">
                </div>

                <div class="field">
                    <label class="field-label" for="filename">Nom du fichier PDF (optionnel)</label>
                    <input type="text" id="filename" name="filename" placeholder="document">
                    <p class="hint" id="filename-hint">Par défaut : document.pdf</p>
                </div>

                <div class="field">
                    <label class="field-label" for="engine">Moteur de conversion</label>
                    <select id="engine" name="engine">
                        <option value="chrome" selected>Chrome headless (Puppeteer)</option>
                    </select>
                    <p class="hint" id="engine-hint"></p>
                </div>

                <div class="field" id="layout-field">
                    <label class="field-label" for="layout">Mise en page</label>
                    <select id="layout" name="layout">
                        <option value="continuous">Page unique à la taille du contenu</option>
                        <option value="paginated">Pagination A4 standard</option>
                    </select>
                </div>

                <button type="submit" id="convert-btn">Convertir en PDF</button>
                <p class="hint" id="convert-hint" hidden>Chrome peut prendre quelques secondes — merci de patienter.</p>
            </form>
        </div>

        <div class="card result-card" id="result-card" hidden>
            <div class="result-header">
                <h2>Aperçu du PDF généré</h2>
                <div class="result-actions">
                    <a id="download-link" class="btn-secondary" download>Télécharger</a>
                    <button type="button" id="close-result" class="btn-secondary">Fermer</button>
                </div>
            </div>
            <iframe id="preview-frame" title="Aperçu du PDF généré"></iframe>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const iconMoon = document.getElementById('icon-moon');
        const iconSun = document.getElementById('icon-sun');

        function syncThemeToggleIcon() {
            const isDark = document.documentElement.dataset.theme === 'dark';
            iconMoon.hidden = isDark;
            iconSun.hidden = !isDark;
            themeToggleBtn.setAttribute('aria-label', isDark ? 'Passer au thème clair' : 'Passer au thème sombre');
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.dataset.theme === 'dark';
            if (isDark) {
                delete document.documentElement.dataset.theme;
                localStorage.setItem('pdf-tools-theme', 'light');
            } else {
                document.documentElement.dataset.theme = 'dark';
                localStorage.setItem('pdf-tools-theme', 'dark');
            }
            syncThemeToggleIcon();
        });

        syncThemeToggleIcon();

        const form = document.getElementById('convert-form');
        const htmlField = document.getElementById('html-field');
        const fileField = document.getElementById('file-field');
        const htmlInput = document.getElementById('html');
        const fileInput = document.getElementById('file');
        const errorsBox = document.getElementById('errors');
        const convertBtn = document.getElementById('convert-btn');
        const convertHint = document.getElementById('convert-hint');
        const engineSelect = document.getElementById('engine');
        const engineHint = document.getElementById('engine-hint');
        const layoutField = document.getElementById('layout-field');
        const layoutSelect = document.getElementById('layout');
        const filenameInput = document.getElementById('filename');
        const filenameHint = document.getElementById('filename-hint');
        const resultCard = document.getElementById('result-card');
        const previewFrame = document.getElementById('preview-frame');
        const downloadLink = document.getElementById('download-link');
        const closeResultBtn = document.getElementById('close-result');

        const ENGINE_INFO = {
            chrome: 'Rendu fidèle (Chrome headless), y compris CSS moderne. Compter quelques secondes.',
        };

        let currentObjectUrl = null;

        function updateEngineUI() {
            const engine = engineSelect.value;
            engineHint.textContent = ENGINE_INFO[engine] || '';

            const isBrowsershot = engine === 'chrome';
            layoutSelect.disabled = !isBrowsershot;
            layoutField.classList.toggle('is-disabled', !isBrowsershot);
        }

        function slugPreview(value) {
            const slug = value
                .normalize('NFD').replace(/\p{Diacritic}/gu, '')
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');

            return slug || 'document';
        }

        function updateFilenameHint() {
            const value = filenameInput.value.trim();
            filenameHint.textContent = value
                ? `Sera enregistré sous : ${slugPreview(value)}.pdf`
                : 'Par défaut : document.pdf';
        }

        function clearErrors() {
            errorsBox.innerHTML = '';
        }

        function showFormError(message) {
            const el = document.createElement('div');
            el.className = 'error';
            el.textContent = message;
            errorsBox.appendChild(el);
        }

        function setLoading(isLoading) {
            convertBtn.disabled = isLoading;
            convertBtn.classList.toggle('is-loading', isLoading);
            convertHint.hidden = !(isLoading && engineSelect.value === 'chrome');
        }

        form.querySelectorAll('input[name="mode"]').forEach((radio) => {
            radio.addEventListener('change', () => {
                if (!radio.checked) return;
                const isHtml = radio.value === 'html';

                htmlField.hidden = !isHtml;
                fileField.hidden = isHtml;
                (isHtml ? htmlInput : fileInput).focus();
            });
        });

        engineSelect.addEventListener('change', updateEngineUI);
        filenameInput.addEventListener('input', updateFilenameHint);
        updateEngineUI();
        updateFilenameHint();

        closeResultBtn.addEventListener('click', () => {
            resultCard.hidden = true;
        });

        form.addEventListener('keydown', (event) => {
            if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            clearErrors();

            const mode = form.querySelector('input[name="mode"]:checked').value;

            if (mode === 'html' && !htmlInput.value.trim()) {
                showFormError('Merci de coller du code HTML avant de convertir.');
                htmlInput.focus();
                return;
            }

            if (mode === 'file' && !fileInput.files.length) {
                showFormError('Merci de choisir un fichier avant de convertir.');
                return;
            }

            const formData = new FormData(form);
            if (mode === 'html') {
                formData.delete('file');
            } else {
                formData.delete('html');
            }

            setLoading(true);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { Accept: 'application/json' },
                });

                if (!response.ok) {
                    let data = null;
                    try {
                        data = await response.json();
                    } catch {
                        // non-JSON response: fall back to a generic message
                    }

                    if (data && data.errors) {
                        Object.values(data.errors).flat().forEach(showFormError);
                    } else {
                        showFormError((data && data.message) || 'La conversion a échoué.');
                    }
                    return;
                }

                const blob = await response.blob();

                if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = URL.createObjectURL(blob);

                const disposition = response.headers.get('Content-Disposition') || '';
                const match = disposition.match(/filename="([^"]+)"/);
                const suggestedName = match ? match[1] : 'document.pdf';

                previewFrame.src = currentObjectUrl;
                downloadLink.href = currentObjectUrl;
                downloadLink.download = suggestedName;
                resultCard.hidden = false;
                resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch {
                showFormError('Impossible de contacter le serveur. Vérifiez votre connexion.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
